<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f6efe6;font-family:Nunito,system-ui,sans-serif;color:#2a2522;position:relative}
h1{font-size:22px;padding:20px 16px 0}
.card{background:#fff;border-radius:22px;margin:12px 16px 0;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.06)}
.big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}
.sub{display:flex;justify-content:space-between;color:#7a6f66}
.bar{height:10px;background:#efe6dc;border-radius:9px;margin-top:12px}.bar i{display:block;width:72%;height:100%;background:#e2552d;border-radius:9px}
.item{display:flex;justify-content:space-between;align-items:center}
.item p{color:#7a6f66;font-size:13px}
.btn{width:40px;height:40px;border-radius:50%;background:#e2552d;color:#fff;display:grid;place-items:center;font-size:22px}
nav{position:absolute;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:14px 0 26px;font-size:13px}
nav .on{color:#e2552d;font-weight:800}
</style></head><body>
<h1>Your bowl</h1>
<div class="card"><div class="big">412 g</div><div class="sub"><span>S$10.84 of S$12</span><span>Tiered</span></div><div class="bar"><i></i></div></div>
<div class="card item"><div><b>Lotus root</b><p>Veg · about 15g each · 4 in bowl</p></div><div class="btn">+</div></div>
<div class="card item"><div><b>Fish ball</b><p>Tofu &amp; balls · about 12g · 4 in bowl</p></div><div class="btn">+</div></div>
<div class="card item"><div><b>Enoki</b><p>Mushroom · about 30g a clump · 1</p></div><div class="btn">+</div></div>
<div class="card item"><div><b>Pork belly</b><p>Meat · about 10g a slice · 5</p></div><div class="btn">+</div></div>
<nav><span class="on">Practice</span><span>Orders</span><span>Top 10</span></nav>
</body></html>
