<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fde2e4;font-family:"Baloo 2",system-ui,sans-serif;color:#3d3d3d}
.top{padding:16px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:22px}.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.c{background:#fff;border-radius:18px;padding:8px;text-align:center;border:3px solid #fff;box-shadow:0 0 0 2px #3d3d3d}
.face{height:72px;border-radius:50%;margin:4px auto 6px;width:72px}
.c b{display:block;font-size:15px;line-height:1}.c p{font-size:11px;line-height:1.2}
.n{background:#ff6f59;color:#fff;border-radius:999px;font-size:12px;padding:0 8px;display:inline-block;margin-top:4px}
</style></head><body>
<div class="top"><b>MalaMaster</b><span class="pill">412g · S$10.84</span></div>
<div class="grid">
<div class="c"><div class="face" style="background:#e2f0cb"></div><b>Lotus</b><p>15g, full of holes</p><span class="n">×4</span></div>
<div class="c"><div class="face" style="background:#ffe5b4"></div><b>Fish Ball</b><p>12g, bouncy</p><span class="n">×4</span></div>
<div class="c"><div class="face" style="background:#fff3c4"></div><b>Enoki</b><p>30g, clingy</p><span class="n">×1</span></div>
<div class="c"><div class="face" style="background:#ffd1dc"></div><b>Pork Belly</b><p>10g, greedy</p><span class="n">×5</span></div>
<div class="c"><div class="face" style="background:#f6e7d7"></div><b>Tau Pok</b><p>10g, a sponge</p><span class="n">×2</span></div>
<div class="c"><div class="face" style="background:#d7e8f6"></div><b>Prawn</b><p>18g, fancy</p><span class="n">×0</span></div>
<div class="c"><div class="face" style="background:#e2f0cb"></div><b>Bok Choy</b><p>25g, leafy</p><span class="n">×2</span></div>
<div class="c"><div class="face" style="background:#ffe0e9"></div><b>Luncheon</b><p>12g, salty</p><span class="n">×2</span></div>
<div class="c"><div class="face" style="background:#eadcf8"></div><b>Beef</b><p>10g, pricey</p><span class="n">×0</span></div>
</div></body></html>
